name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run local fixture and unit tests
        # Keep browser, login, and live-platform tests out of CI.
        run: >-
          python -m pytest -q
          tests/test_aggregate_search_models.py
          tests/test_aggregate_search_adapters.py
          tests/test_aggregate_search_protocol.py
          tests/test_bilibili_light_list.py
          tests/test_platform_limits.py
          tests/test_result_cache.py
          tests/test_search_job_manager.py
          tests/test_search_timing.py
          tests/test_webui_ui_contract.py
          tests/test_xhs_light_list.py

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run search tests
        run: npm run test:search
      - name: Build frontend
        run: npm run build
      - name: Run lint when configured
        shell: bash
        run: |
          if [ -x node_modules/.bin/eslint ]; then
            npm run lint
          else
            echo "eslint is not configured as a webui dependency; skipping lint."
          fi
