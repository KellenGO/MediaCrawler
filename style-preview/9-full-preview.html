function later(fn,delay,group='search'){const current=epochs[group];const id=setTimeout(()=>{timers=timers.filter(t=>t.id!==id);if(epochs[group]===current)fn();},delay);timers.push({id,group});}
function stopTimers(group='all'){timers.filter(t=>group==='all'||t.group===group).forEach(t=>clearTimeout(t.id));timers=timers.filter(t=>group!=='all'&&t.group!==group);Object.keys(epochs).filter(g=>group==='all'||g===group).forEach(g=>epochs[g]++);}
function navigate(path){if(location.hash==='#'+path) render();else location.hash=path;}

function emptyState(symbol,title,desc,action='',button=''){return `<div class="empty"><div class="empty-symbol">${icon(symbol)}</div><h2>${title}</h2><p>${desc}</p>${action?`<button class="btn" data-action="${action}">${button}</button>`:''}</div>`;}

function baseRows(){
 if(route==='/favorites/local')return DATA.filter(r=>state.saved.has(r.id));

 let rows=DATA.filter(r=>state.selected.includes(r.p));

function visibleRows(){let rows=baseRows().filter(r=>(state.filter==='all'||r.p===state.filter)&&(!state.filterText||`${r.title} ${r.desc} ${r.author}`.includes(state.filterText)));if(state.sort==='latest')rows.sort((a,b)=>a.age-b.age);if(state.sort==='engagement')rows.sort((a,b)=>b.likes-a.likes);return rows;}
function resultRow(r,index,local=false){const saved=state.saved.has(r.id);return `<article class="result-row"><span class="result-number">${String(index+1).padStart(2,'0')}</span><div class="result-content"><h2><button class="result-title" data-action="detail" data-id="${r.id}">${r.title}${icon('external')}</button></h2><p class="result-description">${r.desc}</p><div class="result-meta"><span class="source">${dot(r.p)}${labels[r.p]}</span><span>${r.author}</span><span>${r.time}</span><span class="meta-divider"></span><span>${r.type}</span><span>${r.metric} ${moneylessCount(r.likes)}</span></div>${local&&state.notes[r.id]?`<p class="note-line">${icon('note')}<span>${esc(state.notes[r.id])}</span></p>`:''}</div><div class="row-actions"><button class="icon-button ${saved?'saved':''}" data-action="bookmark" data-id="${r.id}" title="${saved?'取消本地收藏':'保存到本地收藏'}" aria-label="${saved?'取消收藏':'收藏'}：${r.title}" aria-pressed="${saved}">${icon('bookmark')}</button>${local?`<button class="icon-button" data-action="note" data-id="${r.id}" title="编辑备注" aria-label="编辑备注：${r.title}">${icon('note')}</button>`:''}</div></article>`;}

function resultsToolbar(local=false){return `<div class="toolbar"><div class="toolbar-left"><label><span class="sr">结果排序</span><select class="field select" data-change="sort"><option value="default" ${state.sort==='default'?'selected':''}>综合排序</option><option value="latest" ${state.sort==='latest'?'selected':''}>最新发布</option><option value="engagement" ${state.sort==='engagement'?'selected':''}>互动最多</option></select></label><label><span class="sr">在当前结果中筛选</span><input class="field filter-input" data-input="filter-text" placeholder="在${local?'收藏':'结果'}中查找…" value="${esc(state.filterText)}"></label></div><div class="button-row"><button class="text-link" data-action="export">导出 / 复制 ${icon('download')}</button></div></div>`;}
function rowContent(){const rows=visibleRows();return rows.length?rows.map((r,i)=>resultRow(r,i,route==='/favorites/local')).join(''):emptyState('search','没有匹配的内容','换个平台，或试着减少筛选条件。','clear-filter','清除筛选');}
function list(local=false){return `${resultTabs()}${resultsToolbar(local)}<div class="result-list" id="result-list">${rowContent()}</div>`;}
function progress(){return `<div class="progress-strip" aria-label="平台搜索进度">${state.selected.map((p,i)=>{const fail=(state.phase==='partial'||state.phase==='failed'||state.phase==='retrying')&&(state.phase==='failed'||p===state.failedPlatform);const pending=(state.phase==='running'||state.phase==='streaming')&&i>=Math.floor(state.visible/2);return `<span class="progress-item">${dot(p)}${labels[p]} <small>${fail?(state.phase==='retrying'?'重试中…':'未完成'):pending?'搜索中…':state.phase==='cancelled'?'已停止':state.phase==='empty'?'0 条':`${baseRows().filter(r=>r.p===p).length} 条`}</small>${fail&&state.phase!=='retrying'?`<button class="text-link" data-action="retry" data-platform="${p}">重试</button>`:''}</span>`;}).join('')}${isSearchBusy()?'<button class="text-link" data-action="cancel-search">取消搜索</button>':'<button class="text-link" data-action="refresh-search">重新搜索</button>'}</div>`;}
function searchPage(){const busy=isSearchBusy();let body='';if(state.phase==='failed')body=emptyState('alert','这次搜索没有完成','示例：平台暂时未响应。可以重试，或先检查账号状态。','refresh-search','重新搜索');else if(state.phase==='empty')body=emptyState('search','还没有找到相关内容','试试更短的关键词，或扩大搜索平台范围。','focus-search','修改关键词');else if(state.phase==='running'&&!state.visible)body=`<div role="status" aria-label="搜索进行中">${[0,1,2].map(()=>'<div class="skeleton" aria-hidden="true"><div></div><div></div><div></div></div>').join('')}<p class="muted" style="font-size:12px;padding-top:18px">正在查找四处的答案…</p></div>`;else body=list()+`<div class="list-end">${!busy&&state.phase!=='cancelled'&&state.visible<DATA.filter(r=>state.selected.includes(r.p)).length?'<button class="btn" data-action="more">继续搜索 '+icon('arrow')+'</button>':''}<p>${busy?'其他平台仍在搜索，已有内容可以先看。':state.phase==='cancelled'?'搜索已停止，已获取内容保留。':`已显示 ${baseRows().length} 条示例内容 · 按平台来源去重展示`}</p></div>`;
 return `<div class="container"><div class="compact-search">${searchForm()}</div><div class="search-headline"><h1>${esc(state.keyword)}</h1><span>${busy?'正在跨平台搜索':state.phase==='cancelled'?'搜索已取消':'相关内容'} · 示例结果</span></div>${progress()}${state.phase==='partial'?`<div class="status-line"><span class="status-message">${icon('alert')}<span>${labels[state.failedPlatform]}暂时未响应，其他平台的结果已保留。</span></span><button class="text-link" data-action="retry" data-platform="${state.failedPlatform}">重试</button></div>`:''}${state.phase==='cancelled'?'<div class="status-line"><span>已取消后续搜索，你仍可查看和收藏已有内容。</span><button class="text-link" data-action="refresh-search">重新开始</button></div>':''}${body}</div>`;
}
function collectionPage(remote){return `<div class="container"><div class="collection-heading">${pageHeading('YOUR COLLECTION','留住值得再看的内容',remote?'把不同平台的收藏放在一起，慢慢阅读。':'给有用的内容一个位置，也记下自己的想法。',remote?'':'<button class="btn" data-action="backup">'+icon('download')+'备份管理</button>')}<div class="collection-switch"><nav class="tabs" aria-label="收藏类型"><a class="tab ${!remote?'active':''}" href="#/favorites/local">本地收藏 <span>${state.saved.size}</span></a><a class="tab ${remote?'active':''}" href="#/favorites/remote">跨平台收藏</a></nav></div>${remote?`<div class="page-heading" style="margin-bottom:0"><div><h2>跨平台收藏</h2><p class="description">从已登录的平台读取收藏，可再保存到本地。</p></div><button class="btn primary" data-action="sync-remote" ${state.remote==='syncing'?'disabled':''}>${icon(state.remote==='syncing'?'loader':'refresh',state.remote==='syncing'?'spinner':'')}${state.remote==='syncing'?'正在同步':state.remote==='complete'?'重新同步':'同步收藏'}</button></div>${scope(true)}<p class="collection-count">每个平台单次最多 20 条 · 本预览只展示示例，不读取真实收藏</p>`:`<p class="collection-count">${state.saved.size} 条已收藏 · 备注与收藏仅在本次演示中保留</p>`}</div>${remote?(state.remote==='idle'?emptyState('folder','把喜欢的内容，放到一起','选择平台后点击同步，看看聚合收藏的样子。','sync-remote','同步示例收藏'):state.remote==='syncing'?`<div class="empty" role="status"><div class="empty-symbol">${icon('loader','spinner')}</div><h2>正在整理你的收藏</h2><p>先获取列表，再补充内容信息。</p><button class="text-link" data-action="cancel-remote">取消同步</button></div>`:list()+`<div class="list-end">示例同步已完成 · 不会修改平台中的任何收藏</div>`):state.saved.size?list(true):emptyState('bookmark','收藏夹还空着','遇到值得再读的内容，点一下右侧的收藏图标。','go-search','去看看搜索结果')}</div>`;}

function accountCard(p){const st=state.accounts[p];const name={ok:'已登录',expired:'登录已过期',out:'未登录',syncing:'正在同步',checking:'正在验证'}[st];const busy=st==='syncing'||st==='checking';return `<article class="account-card"><div class="account-card-head"><h3>${dot(p)}${labels[p]}</h3><span class="pill ${st==='ok'?'good':st==='expired'?'warn':''}">${busy?icon('loader','spinner'):''}${name}</span></div><p>${st==='ok'?'示例账号 · 最近验证于今天 10:24':busy?'正在检查示例会话，请稍候…':st==='expired'?'重新登录并同步后，可以继续搜索与读取收藏。':'先在浏览器登录平台，再同步登录状态。'}</p><div class="account-actions"><button class="btn small" data-action="sync-account" data-platform="${p}" ${busy?'disabled':''}>同步登录状态</button><button class="btn ghost small" data-action="verify-account" data-platform="${p}" ${busy?'disabled':''}>重新验证</button><button class="btn ghost small" data-action="login" data-platform="${p}">前往登录 ${icon('external')}</button></div><details><summary>诊断与其他方式</summary><div class="diagnostic">会话来源：浏览器扩展（示例）<br>最近操作：${st==='ok'?'验证通过':st==='expired'?'会话已过期':'暂无验证记录'}<br>这里只展示状态，不包含真实 Cookie 或账号信息。<div class="button-row"><button class="text-link" data-action="aux-login" data-platform="${p}">备用辅助登录</button><button class="text-link" style="color:var(--red)" data-action="clear-account" data-platform="${p}" ${busy?'disabled':''}>清除登录状态</button></div></div></details></article>`;}

/button></div></section></div></div>`;}
function focusSnapshot(root){const el=document.activeElement;if(!el||!root.contains(el))return null;return {tag:el.tagName,attrs:['id','name','href','data-action','data-change','data-input','data-platform','data-value','data-id','data-key','data-step'].map(k=>[k,el.getAttribute(k)]),start:el.selectionStart,end:el.selectionEnd};}
function restoreFocus(root,snapshot){if(!snapshot)return;const el=[...root.querySelectorAll('button,input,select,textarea,a')].find(e=>e.tagName===snapshot.tag&&snapshot.attrs.every(([k,v])=>e.getAttribute(k)===v));if(el&&!el.disabled){el.focus({preventScroll:true});if(typeof snapshot.start==='number'&&typeof el.setSelectionRange==='function'&&el.type!=='number')el.setSelectionRange(snapshot.start,snapshot.end);}}
function render(){const focused=focusSnapshot(document.body);applyTheme();$('#header').innerHTML=header();$('#main').innerHTML=route==='/'?home():route==='/search'?searchPage():route==='/favorites/local'?collectionPage(false):route==='/favorites/remote'?collectionPage(true):route.startsWith('/settings/')?settingsPage():helpPage();document.title=`${({'/':'主页','/search':'搜索结果','/favorites/local':'本地收藏','/favorites/remote':'跨平台收藏','/settings/search':'搜索设置','/settings/accounts':'账号与登录','/settings/appearance':'外观与首页','/help':'使用帮助'})[route]} · 四野预览`;restoreFocus(document.body,focused);}
function routeChanged(){const raw=location.hash.slice(1)||'/';const [path,query='']=raw.split('?');const allowed=['/','/search','/favorites/local','/favorites/remote','/settings/search','/settings/accounts','/settings/appearance','/help'];route=allowed.includes(path)?path:'/';const q=new URLSearchParams(query).get('q');if(route==='/search'&&q)state.keyword=q.slice(0,200);state.filter='all';state.sort='default';state.filterText='';closeDialog();closeScenarios();render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});}
function closeScenarios(){const panel=$('#scenarios');panel.hidden=true;$('#scenario-toggle').setAttribute('aria-expanded','false');}
function closeDialog(){const d=$('#dialog');if(d.open)d.close();dialogType='';}
function showDialog(title,content,actions='',type='info'){
 const d=$('#dialog');if(!d.open)dialogFocus=document.activeElement;dialogType=type;

 if(!d.open)d.showModal();
}

function updatePrefs(){persist();render();if(dialogType==='customize')customize();}
function showDetail(id){const r=DATA.find(x=>x.id===id);if(!r)return;showDialog(r.title,`<p class="detail-source">${dot(r.p)} ${labels[r.p]} · ${r.author} · ${r.time}</p><p class="detail-content">${r.desc}</p><div class="detail-metrics"><span>${r.type}</span><span>${r.metric} ${moneylessCount(r.likes)}</span></div><div class="info-box"><p>这是一条示例内容，用于查看详情弹层效果。正式应用中，内容标题将链接到平台原文。</p></div>`,`<button class="btn" data-action="close-dialog">关闭</button><button class="btn primary" data-action="detail-bookmark" data-id="${id}">${state.saved.has(id)?'取消本地收藏':'保存到本地'}</button>`,'detail');}
function showNote(id){noteId=id;const r=DATA.find(x=>x.id===id);if(!r)return;showDialog('给收藏写点备注',`<p>${r.title}</p><label><span class="sr">收藏备注</span><textarea id="note-input" maxlength="500" placeholder="为什么收藏它？下次要记得什么？">${esc(state.notes[id]||'')}</textarea></label><small class="muted">最多 500 字 · 仅本次演示保留</small>`,'<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="save-note">保存备注</button>','note');$('#note-input').focus();}
function beginSearch(keyword){
 if(isSearchBusy())return;
 const kw=String(keyword).trim().slice(0,200);if(!kw){notify('先输入一个想搜索的关键词。');return;}
 stopTimers('search');state.keyword=kw;state.draft=kw;state.phase='running';state.visible=0;state.limit=8;state.first=false;state.filter='all';state.filterText='';
 state.history=[kw,...state.history.filter(k=>k!==kw)].slice(0,8);navigate('/search?q='+encodeURIComponent(kw));render();
 later(()=>{state.phase='streaming';state.visible=2;render();},650);
 later(()=>{state.visible=4;render();},1250);
 later(()=>{state.phase='complete';state.visible=8;render();notify('示例搜索完成。真实内容不会在此预览中获取。');},2100);
}
function retrySearch(platform){if(isSearchBusy())return;stopTimers('search');state.failedPlatform=platform;state.phase='retrying';render();later(()=>{state.phase='complete';state.visible=8;render();notify(`${labels[platform]}示例重试成功，结果已合并。`);},1000);}
function syncAccount(p,verify=false){if(['syncing','checking'].includes(state.accounts[p]))return;state.accounts[p]=verify?'checking':'syncing';render();later(()=>{state.accounts[p]='ok';render();notify(`${labels[p]}${verify?'验证':'同步'}完成（示例）。`);},900,'account');}
function syncRemote(){if(state.remote==='syncing')return;stopTimers('remote');state.remote='syncing';state.filter='all';state.filterText='';render();later(()=>{state.remote='complete';render();notify('示例收藏同步完成，未读取真实平台数据。');},1250,'remote');}
function setScene(name){
 stopTimers();state=initialState();closeDialog();closeScenarios();
 if(name==='first'){state.first=true;state.history=[];state.saved.clear();state.accounts=Object.fromEntries(PLATFORMS.map(p=>[p,'out']));navigate('/');}
 else if(name==='loggedout'){state.accounts=Object.fromEntries(PLATFORMS.map(p=>[p,'out']));navigate('/settings/accounts');}
 else if(name==='empty-saved'){state.saved.clear();state.notes={};navigate('/favorites/local');}
 else if(name==='loading'){beginSearch('露营装备');}
 else {state.phase=({normal:'complete',partial:'partial',empty:'empty',failed:'failed'})[name]||'complete';navigate('/search?q='+encodeURIComponent(state.keyword));}
 render();
}
function toggleBookmark(id){if(state.saved.has(id)){state.saved.delete(id);notify('已从演示收藏中移除。');}else{state.saved.add(id);notify('已保存到本地收藏（示例）。');}render();}
function setLimit(p,raw){const n=String(raw).trim()===''?20:Number(raw);state.limits[p]=Number.isFinite(n)?Math.min(40,Math.max(1,Math.round(n))):20;render();}
document.addEventListener('submit',event=>{if(event.target.matches('[data-form="search"]')){event.preventDefault();beginSearch(event.target.elements.keyword.value);}});
document.addEventListener('input',event=>{
 const el=event.target;
 if(el.name==='keyword'){if(route==='/')state.draft=el.value;else state.keyword=el.value;}
 if(el.dataset.input==='filter-text'){state.filterText=el.value;const rows=$('#result-list');if(rows)rows.innerHTML=rowContent();}
});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.change==='sort'){state.sort=el.value;render();}if(el.dataset.change==='limit')setLimit(el.dataset.platform,el.value);});
document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.dataset.change==='limit'){event.preventDefault();setLimit(event.target.dataset.platform,event.target.value);}if(event.key==='Escape'&&!$('#scenarios').hidden){closeScenarios();$('#scenario-toggle').focus();}});
document.addEventListener('click',event=>{
 const scenario=event.target.closest('[data-scenario]');if(scenario){setScene(scenario.dataset.scenario);return;}
 const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
 event.preventDefault();const {action,platform,value,key}=button.dataset;const id=Number(button.dataset.id);
 switch(action){
 case 'scenarios':{const panel=$('#scenarios');panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)panel.querySelector('button').focus();break;}
 case 'reset-demo':stopTimers();state=initialState();prefs=defaults();persist();closeScenarios();closeDialog();navigate('/');render();notify('已恢复全部演示初始状态。');break;
 case 'theme-toggle':prefs.theme=prefs.theme==='dark'?'light':'dark';updatePrefs();break;
 case 'set-theme':prefs.theme=value;updatePrefs();break;
 case 'customize':customize();break;
 case 'set-mode':prefs.mode=value;updatePrefs();break;
 case 'section-toggle':prefs[key]=!prefs[key];if(prefs[key])prefs.mode='full';updatePrefs();break;
 case 'close-dialog':closeDialog();break;
 case 'platform':{const remote=button.dataset.remote==='true';const arr=remote?state.remoteSelected:state.selected;if(arr.includes(platform)){if(arr.length===1){notify('至少保留一个平台。');break;}arr.splice(arr.indexOf(platform),1);}else arr.push(platform);if(remote&&state.remote==='complete')state.remote='idle';render();break;}
 case 'history-search':beginSearch(button.dataset.keyword);break;
 case 'clear-history':state.history=[];render();notify('已清空示例搜索历史。');break;
 case 'cancel-search':stopTimers('search');state.phase='cancelled';render();notify('已取消示例搜索，保留已经获取的结果。');break;
 case 'refresh-search':beginSearch(state.keyword);break;
 case 'retry':retrySearch(platform);break;
 case 'more':state.visible=Math.min(DATA.length,state.visible+4);state.phase='complete';render();notify('已展示下一批示例结果。');break;
 case 'filter':state.filter=platform;render();break;
 case 'clear-filter':state.filter='all';state.filterText='';render();break;
 case 'focus-search':$('input[name="keyword"]')?.focus();break;
 case 'go-search':state.phase='complete';state.visible=8;navigate('/search?q='+encodeURIComponent(state.keyword));break;
 case 'detail':showDetail(id);break;
 case 'bookmark':toggleBookmark(id);break;
 case 'detail-bookmark':toggleBookmark(id);showDetail(id);break;
 case 'note':showNote(id);break;
 case 'save-note':state.notes[noteId]=$('#note-input').value.trim();closeDialog();render();notify('备注已保存到本次演示。');break;
 case 'export':showDialog('导出与复制',`<p>当前筛选下有 ${visibleRows().length} 条示例内容。选择格式，查看操作反馈。</p><p style="margin-top:10px">预览不生成文件，也不会写入剪贴板。</p>`,['CSV','Markdown','复制链接'].map(v=>`<button class="btn small" data-action="mock-export" data-value="${v}" ${!visibleRows().length?'disabled':''}>${v}</button>`).join(''));break;
 case 'mock-export':closeDialog();notify(`${value}操作演示完成；未下载或复制真实内容。`);break;
 case 'backup':showDialog('管理收藏备份','<p>正式应用可用 JSON 备份收藏和备注，导入时合并新增内容、保留已有版本。</p><p style="margin-top:10px">这里可以演示导入一条固定示例，不读取你的文件。</p>','<button class="btn" data-action="mock-export" data-value="导出备份">导出备份</button><button class="btn primary" data-action="mock-import">演示导入</button>');break;
 case 'mock-import':state.saved.add(10);closeDialog();render();notify('已合并一条固定示例收藏；没有读取文件。');break;
 case 'sync-remote':syncRemote();break;
 case 'cancel-remote':stopTimers('remote');state.remote='idle';render();notify('已取消示例同步。');break;
 case 'limit-step':setLimit(platform,state.limits[platform]+Number(button.dataset.step));break;
 case 'reset-limits':state.limits=Object.fromEntries(PLATFORMS.map(p=>[p,20]));render();notify('已恢复为每个平台 20 条。');break;
 case 'sync-account':syncAccount(platform);break;
 case 'verify-account':syncAccount(platform,true);break;
 case 'sync-all':PLATFORMS.forEach(p=>syncAccount(p));break;
 case 'login':showDialog(`登录${labels[platform]}`,'<p>正式应用会打开平台官网，由你在浏览器完成登录，再返回设置同步。</p><div class="info-box"><p>当前是界面预览，不打开真实登录页，不读取任何凭据。</p></div>',`<button class="btn" data-action="close-dialog">返回</button><button class="btn primary" data-action="mock-login" data-platform="${platform}">模拟已登录</button>`);break;
 case 'mock-login':closeDialog();syncAccount(platform);break;
 case 'aux-login':showDialog('备用辅助登录','<p>当扩展同步失败时，正式应用可打开独立辅助浏览器进行扫码登录。它不会复用当前浏览器会话。</p><p style="margin-top:12px">这份预览只演示该入口，不启动辅助浏览器。</p>','<button class="btn primary" data-action="close-dialog">知道了</button>');break;
 case 'clear-account':showDialog(`清除${labels[platform]}登录状态？`,'<p>这里只重置演示状态，不删除真实会话。正式应用中，清除本地后台登录数据后需要重新同步。</p>',`<button class="btn" data-action="close-dialog">取消</button><button class="btn danger" data-action="confirm-clear-account" data-platform="${platform}">清除演示状态</button>`);break;
 case 'confirm-clear-account':state.accounts[platform]='out';closeDialog();render();notify('已清除该平台的演示登录状态。');break;
 case 'disclaimer':showDialog('使用须知与预览说明','<p>这是一份四野 UI 交互预览，全部内容与状态均为示例。搜索、登录、同步和文件操作不会连接正式服务。</p><p style="margin-top:12px">正式项目仅供个人学习研究使用，须遵守项目完整许可与平台规则。内容权利归原作者；本简要说明不替代正式应用中的许可文本。</p><p style="margin-top:12px">基于 MediaCrawler，原项目作者：程序员阿江-Relakkes；本项目维护：KellenGong。</p>','<button class="btn primary" data-action="close-dialog">关闭</button>');break;
 }
});
document.addEventListener('pointerdown',event=>{if(!$('#scenarios').hidden&&!event.target.closest('#scenarios,#scenario-toggle'))closeScenarios();});
$('#dialog').addEventListener('click',event=>{if(event.target!==$('#dialog'))return;const r=$('#dialog').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog();});
$('#dialog').addEventListener('close',()=>{dialogType='';if(dialogFocus?.isConnected)dialogFocus.focus({preventScroll:true});});
$('#dialog').addEventListener('cancel',()=>{dialogType='';});
window.addEventListener('hashchange',routeChanged);
routeChanged();
</script>
</body>
</html>
