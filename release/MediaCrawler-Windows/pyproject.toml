[project]
name = "mediacrawler"
authors = [{name = "relakkes", email = "relakkes@gmail.com"}]
version = "0.1.0"
description = "Cross-platform Chinese social content search for Xiaohongshu, Douyin, Bilibili, and Zhihu."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45.0.7",
    "fastapi==0.110.2",
    "httpx==0.28.1",
    "opencv-python>=4.11.0.86",
    "parsel==1.9.1",
    "pillow>=12.2.0",
    "playwright>=1.61.0",
    "pydantic>=2.13.4",
    "pyexecjs==1.5.1",
    "redis~=4.6.0",
    "tenacity==8.2.2",
    "uvicorn==0.29.0",
    "websockets>=15.0.1",
    "xhshow>=0.2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
markers = [
    "integration: requires an external service or live provider",
]
